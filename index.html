<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cờ Vua"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0e1424">
<title>Cờ Vua</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233b5578'/%3E%3Cpath d='M27 72C27 57 34 48 43 42C38 43 33 45 28 45C22 45 19 42 19 38C19 34 23 30 30 26C35 23 39 20 42 17L45 10L50 16L54 10L56 17C68 22 76 37 74 58C73 64 72 69 73 72Z' fill='%23fff' stroke='%231c2438' stroke-width='3' stroke-linejoin='round'/%3E%3Crect x='24' y='72' width='52' height='7' rx='3.5' fill='%23fff' stroke='%231c2438' stroke-width='3'/%3E%3Crect x='19' y='79' width='62' height='9' rx='4.5' fill='%23fff' stroke='%231c2438' stroke-width='3'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="ati" href="">
<style>
:root{--bg:#0e1424;--pan:#1a2238;--ink:#f1f3f9;--mut:#9aa3b8;--gold:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;color:var(--ink);font-family:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(120% 80% at 50% 0,#1d2a4d,var(--bg)) fixed,var(--bg)}
body.q-lo{background:var(--bg)}
.scr{display:none;height:100%;flex-direction:column;align-items:center;gap:10px;padding:14px}
.scr.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
h1{margin:0;font-size:clamp(36px,9vw,58px);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fff,#aebbdb);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:-2px 0 6px;letter-spacing:.03em}
#menu{justify-content:center}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(600px,100%)}
.cd{position:relative;isolation:isolate;animation:cin .5s both;border:1px solid #ffffff26;border-radius:22px;padding:0 0 14px;text-align:left;overflow:hidden;box-shadow:0 8px 24px #0006;display:flex;flex-direction:column;gap:2px;transition:transform .15s}
.cd:nth-child(2){animation-delay:.07s}.cd:nth-child(3){animation-delay:.14s}.cd:nth-child(4){animation-delay:.21s}
.cd::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 60% at 15% 0,#ffffff3a,transparent 60%),radial-gradient(60% 50% at 100% 100%,#0000004d,transparent)}
.cd:active{transform:scale(.96)}
.cd svg{width:100%;display:block;filter:drop-shadow(0 6px 8px #0005);transition:transform .25s}
.cd:active>svg{transform:translateY(-3px) scale(1.04)}
.cd b{padding:0 14px;font-size:clamp(17px,4.6vw,24px);font-weight:800}
.cd b::after{content:" ›";opacity:.7}
.cd small{padding:0 14px;color:#ffffffbb;font-size:clamp(12px,3.3vw,15px)}
@keyframes cin{from{opacity:0;transform:translateY(14px) scale(.97)}}
.q-lo .cd{animation:none}@media(prefers-reduced-motion:reduce){.cd{animation:none}}
.c1{background:linear-gradient(160deg,#3f6fb5,#22396b)}.c2{background:linear-gradient(160deg,#2aa58f,#145a63)}.c3{background:linear-gradient(160deg,#d98a2b,#8a3f1d)}.c4{background:linear-gradient(160deg,#8a5bd6,#412a80)}

/* ===== QUÂN CỜ SẮC NÉT, ĐỒNG ĐỀU ===== */
.w{fill:url(#gw);stroke:#232b40;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.b{fill:url(#gb);stroke:#0b0e17;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.q-lo .w{fill:#f4f6fb;stroke:#232b40}.q-lo .b{fill:#2d3448;stroke:#0b0e17}
.w .h{fill:#ffffff;fill-opacity:.65;stroke:none}
.b .h{fill:#9fb2db;fill-opacity:.18;stroke:none}
.w .d{fill:none;stroke:#384463;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.72}
.b .d{fill:none;stroke:#9aa8c9;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.58}
.w .eye{fill:#232b40;stroke:none}
.b .eye{fill:#b7c4e0;stroke:none}
.q-lo .h{display:none}
.q-lo .w .d{stroke-opacity:.55}.q-lo .b .d{stroke-opacity:.5}
.pc{position:relative;z-index:3;display:block;width:86%;height:86%;shape-rendering:geometricPrecision}
.q-hi .pc{filter:drop-shadow(0 2.5px 2px #0007)}
.q-mid .pc{filter:drop-shadow(0 1.5px 1px #0005)}

.rb{position:fixed;top:calc(env(safe-area-inset-top) + 10px);width:44px;height:44px;border-radius:50%;background:var(--pan);font-size:20px;z-index:5;box-shadow:0 2px 8px #0005}
#gear{left:calc(env(safe-area-inset-left) + 12px)}#mu{right:calc(env(safe-area-inset-right) + 12px)}
#mu.off{opacity:.5}
.sheet{position:fixed;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:center;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.on{opacity:1;pointer-events:auto}
.in{width:min(520px,100%);background:var(--pan);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;transform:translateY(100%);transition:transform .25s}
.sheet.on .in{transform:none}
.in h3{margin:0;font-size:20px}
.g{display:flex;flex-direction:column;gap:6px}.g[hidden]{display:none}
.g label{font-size:13px;color:var(--mut)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:3px;gap:3px}
.seg b{flex:1;text-align:center;padding:13px 2px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut);cursor:pointer}
.seg b.on{background:#5b7a99;color:#fff}
.go{padding:16px;border-radius:14px;background:var(--gold);color:#1a1405;font-weight:800;font-size:18px}
.q{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--bg);border:2px solid transparent;text-align:left;width:100%}
.q.on{border-color:var(--gold)}.q span{font-size:28px}.q b{display:block}.q small{color:var(--mut)}
#game{--s:min(96vw,calc(100dvh - 300px),780px);padding-top:58px;gap:8px}
.pan{width:var(--s);display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:12px;background:var(--pan);border:2px solid transparent;font-weight:600}
.pan.rot{transform:rotate(180deg)}.pan.act{border-color:#5b7a99}
.pan.pend{border-color:var(--gold);background:#3a3220}
.ck{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.ck.low{color:#ff6b70}

/* ===== BÀN CỜ GỖ CHI TIẾT, SẮC NÉT ===== */
#fr{
  --pad:clamp(16px,3.8vw,22px);
  position:relative;
  width:var(--s);
  padding:var(--pad);
  border-radius:16px;
  background:
    repeating-linear-gradient(90deg,#ffffff05 0 2px,transparent 2px 7px),
    linear-gradient(145deg,#7b4e2a,#4a2c15 56%,#351e0e);
  box-shadow:0 16px 42px #000b,inset 0 1px 0 #ffffff2e,inset 0 -2px 5px #0008;
}
.q-lo #fr{--pad:10px;background:#5a3a20;box-shadow:none}
#bd{
  width:100%;
  aspect-ratio:1;
  display:grid;
  grid-template:repeat(8,1fr)/repeat(8,1fr);
  border-radius:3px;
  overflow:hidden;
  box-shadow:0 0 0 1.5px #d4aa5a77,0 2px 8px #0007;
}
.q-lo #bd{box-shadow:0 0 0 1.5px #0006}
.sq{display:flex;align-items:center;justify-content:center;position:relative}
.sq.l{background:repeating-linear-gradient(0deg,#8b5a2b07 0 1px,transparent 1px 5px),linear-gradient(135deg,#f6ebd4,#e8d6b3)}
.sq.d{background:repeating-linear-gradient(0deg,#0000000d 0 1px,transparent 1px 5px),linear-gradient(135deg,#9f6c43,#81532f)}
.q-lo .sq.l{background:#ecdcb9}.q-lo .sq.d{background:#8b5e3c}
.q-hi .sq{box-shadow:inset 0 1px 0 #ffffff22,inset 0 -1px 0 #00000018}
.sq.lm::before,.sq.sel::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.sq.lm::before{background:#f5c84c66;box-shadow:inset 0 0 0 1.5px #f5c84c88}
.sq.sel::before{background:#f7d04699;box-shadow:inset 0 0 0 2.5px #ffe066}
.sq.chk{background-image:radial-gradient(circle,#ff3b30dd 0%,#ff3b3066 52%,transparent 76%)}
.sq.mv::after{content:"";position:absolute;z-index:4;width:26%;height:26%;border-radius:50%;background:#171d2e80;box-shadow:0 0 0 2px #ffffff4d;pointer-events:none}
.sq.mv.cap::after{width:86%;height:86%;background:none;border:3.5px solid #171d2e85;box-shadow:inset 0 0 0 1.5px #ffffff4d,0 0 0 1px #ffffff33}
.coords{position:absolute;pointer-events:none;color:#ebd6ad;font-weight:700;font-size:clamp(10px,2.4vw,13px);line-height:1;text-shadow:0 1px 1px #0009;opacity:.92}
.q-lo .coords{display:none}
#rk-col{left:0;top:var(--pad);bottom:var(--pad);width:var(--pad);display:grid;grid-template-rows:repeat(8,1fr);place-items:center}
#fl-row{bottom:0;left:var(--pad);right:var(--pad);height:var(--pad);display:grid;grid-template-columns:repeat(8,1fr);place-items:center}

#st{height:22px;color:var(--mut);font-size:15px}
.bar{display:flex;gap:8px;width:var(--s)}
.bar button{flex:1;padding:12px 4px;border-radius:12px;background:var(--pan);font-weight:600;font-size:14px}
.bar button:disabled{opacity:.35}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;overflow:hidden}
#ov.on{display:flex}
#pp{position:relative;z-index:2;width:min(340px,86vw);border-radius:26px;padding:26px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px #000a}
#pp.win{background:linear-gradient(160deg,#f6c94b,#c4761b)}#pp.lose{background:linear-gradient(160deg,#66789c,#2a3350)}#pp.draw{background:linear-gradient(160deg,#4fc08d,#1d7a6b)}
.em{font-size:84px;line-height:1.1;animation:bn 1s ease-in-out infinite}
@keyframes bn{50%{transform:scale(1.14) rotate(-6deg)}}
#pp h2{margin:0;font-size:32px;font-weight:800;text-shadow:0 2px 6px #0004}
#pp p{margin:0 0 8px;opacity:.92}
#pp button{padding:14px;border-radius:14px;background:#ffffff33;font-weight:700}#pp .pri{background:#fff;color:#222}
#cf span{position:absolute;top:-20px;width:9px;height:14px;animation:fall 3s linear infinite}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.q-lo .em{animation:none}
@media(prefers-reduced-motion:reduce){.em,#cf span{animation:none}}
#gear.nu::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:#e5484d}
#ub{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translateX(-50%);z-index:7;background:var(--gold);color:#1a1405;padding:10px 14px;border-radius:14px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px #0008;white-space:nowrap}
#ub[hidden]{display:none}#ub button{background:#1a1405;color:var(--gold);padding:7px 12px;border-radius:10px;font-weight:700}
.hn{font-size:12px;color:var(--mut);line-height:1.4}.hn[hidden]{display:none}
.qt{display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--bg);border:2px solid transparent;text-align:left;width:100%}.qt.on{border-color:var(--gold)}.qt span{font-size:26px}.qt b{display:block}.qt small{color:var(--mut)}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tl.g4{grid-template-columns:repeat(4,1fr)}
.tl b{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:16px;background:var(--pan);border:2px solid transparent;font-size:14px;font-weight:700;text-align:center;cursor:pointer;transition:transform .12s}
.tl b:active{transform:scale(.96)}.tl b i{font-style:normal;font-size:26px;line-height:1.2}.tl b small{font-weight:500;color:var(--mut);font-size:11px}
.tl b.on{border-color:var(--gold);background:#2a3050}
.grab{width:42px;height:5px;border-radius:3px;background:#ffffff33;align-self:center;margin:-6px 0 2px}
#sh .in{gap:16px}#sh h3{font-size:22px}
.tl b svg{width:46px;height:46px}
#sh .go{box-shadow:0 8px 20px #f2c14e44}
#sh .tl{gap:10px}
#sh .tl b{position:relative;background:#252f4d;border:2px solid #36436b;border-radius:18px;padding:12px 4px 10px;gap:7px;font-size:14px;color:#e6eaf6;transition:transform .12s,background .15s,border-color .15s}
#sh .tl b:active{transform:scale(.96)}
#sh .tl b.on{background:#3a3f66;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 6px 16px #0006;color:#fff}
#sh .tl b.on::after{content:"✓";position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1405;font-size:13px;font-weight:900;display:grid;place-items:center;line-height:1}
.ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #ffffff2e,0 3px 8px #0005}
.ic svg{width:42px!important;height:42px!important}.ic.sq2{width:64px;height:64px;border-radius:14px}.ic.sq2 svg{width:54px!important;height:54px!important}
.dt{display:flex;gap:4px;height:6px}.dt u{width:6px;height:6px;border-radius:50%;background:#46507a}.dt u.f{background:var(--gold)}
#sh .tl b small{font-size:12px;color:#a9b3cf;margin-top:-4px}
.clk{width:52px;height:52px}
#sh .tl.g4 b{padding-top:10px}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
const V={P:100,N:320,B:330,R:500,Q:900,K:0};
const DG=[[1,1],[1,-1],[-1,1],[-1,-1]],OR=[[1,0],[-1,0],[0,1],[0,-1]];
const D={B:DG,R:OR,Q:[...DG,...OR],K:[...DG,...OR],N:[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]};
const LV=['Siêu dễ','Dễ','Vừa','Khó'],NM={w:'Trắng',b:'Đen'};
let Q=localStorage.getItem('q')||((navigator.hardwareConcurrency||8)<=4?'lo':'mid');
/* ===== LUẬT CỜ ===== */
function init(){const b=[];'rnbqkbnr'.split('').forEach((x,i)=>{b[i]='b'+x.toUpperCase();b[8+i]='bP';b[48+i]='wP';b[56+i]='w'+x.toUpperCase()});for(let i=16;i<48;i++)b[i]=null;return{b,t:'w',c:'KQkq',e:-1,n:0}}
const ok=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function att(b,s,by){const r=s>>3,c=s&7,pr=r+(by=='w'?1:-1);
  if(pr>=0&&pr<8)for(const dc of[-1,1])if(ok(pr,c+dc)&&b[pr*8+c+dc]==by+'P')return 1;
  for(const k of'NK')for(const[dr,dc]of D[k])if(ok(r+dr,c+dc)&&b[(r+dr)*8+c+dc]==by+k)return 1;
  for(const[ks,dd]of[['BQ',DG],['RQ',OR]])for(const[dr,dc]of dd){let rr=r+dr,cc=c+dc;
    while(ok(rr,cc)){const p=b[rr*8+cc];if(p){if(p[0]==by&&ks.includes(p[1]))return 1;break}rr+=dr;cc+=dc}}
  return 0}
const chk=(b,t)=>att(b,b.indexOf(t+'K'),t=='w'?'b':'w');
function gen(S){const{b,t}=S,o=[],f=t=='w'?-1:1,opp=t=='w'?'b':'w';
  for(let i=0;i<64;i++){const p=b[i];if(!p||p[0]!=t)continue;const r=i>>3,c=i&7,k=p[1];
    if(k=='P'){const pr=r+f;if(pr<0||pr>7)continue;const pm=pr==0||pr==7?'Q':undefined,to=pr*8+c;
      if(!b[to]){o.push({f:i,t:to,p:pm});if(r==(t=='w'?6:1)&&!b[to+f*8])o.push({f:i,t:to+f*8,d:1})}
      for(const dc of[-1,1]){if(c+dc<0||c+dc>7)continue;const q=pr*8+c+dc;
        if(b[q]&&b[q][0]==opp)o.push({f:i,t:q,p:pm});else if(q==S.e)o.push({f:i,t:q,ep:1})}}
    else if(k=='N'||k=='K'){for(const[dr,dc]of D[k]){if(!ok(r+dr,c+dc))continue;const q=(r+dr)*8+c+dc;if(!b[q]||b[q][0]==opp)o.push({f:i,t:q})}}
    else for(const[dr,dc]of D[k]){let rr=r+dr,cc=c+dc;while(ok(rr,cc)){const q=rr*8+cc;if(!b[q])o.push({f:i,t:q});else{if(b[q][0]==opp)o.push({f:i,t:q});break}rr+=dr;cc+=dc}}}
  const ks=t=='w'?60:4;
  if(b[ks]==t+'K'&&!att(b,ks,opp)){
    if(S.c.includes(t=='w'?'K':'k')&&!b[ks+1]&&!b[ks+2]&&b[ks+3]==t+'R'&&!att(b,ks+1,opp)&&!att(b,ks+2,opp))o.push({f:ks,t:ks+2,cs:1});
    if(S.c.includes(t=='w'?'Q':'q')&&!b[ks-1]&&!b[ks-2]&&!b[ks-3]&&b[ks-4]==t+'R'&&!att(b,ks-1,opp)&&!att(b,ks-2,opp))o.push({f:ks,t:ks-2,cs:1})}
  return o}
function mk(S,m){const b=S.b.slice(),p=b[m.f],t=S.t;let c=S.c,e=-1;
  b[m.t]=m.p?t+m.p:p;b[m.f]=null;
  if(m.ep)b[m.t+(t=='w'?8:-8)]=null;
  if(m.cs){const row=m.f&~7;if(m.t>m.f){b[row+5]=b[row+7];b[row+7]=null}else{b[row+3]=b[row];b[row]=null}}
  if(m.d)e=(m.f+m.t)/2;
  if(p[1]=='K')c=c.replace(t=='w'?/[KQ]/g:/[kq]/g,'');
  for(const[s,x]of[[0,'q'],[7,'k'],[56,'Q'],[63,'K']])if(m.f==s||m.t==s)c=c.replace(x,'');
  return{b,t:t=='w'?'b':'w',c,e,n:S.n+1}}
const legal=S=>gen(S).filter(m=>!chk(mk(S,m).b,S.t));

/* ===== MÁY ===== */
function ev(S){let s=0;for(let i=0;i<64;i++){const p=S.b[i];if(!p)continue;const r=i>>3,c=i&7,k=p[1];
  let v=V[k]+(7-Math.abs(2*c-7)/2-Math.abs(2*r-7)/2)*(k=='P'?2:k=='K'?0:4);
  if(k=='P')v+=(p[0]=='w'?6-r:r-1)*6;s+=p[0]=='w'?v:-v}
  return S.t=='w'?s:-s}
function order(L,S){const sc=m=>(S.b[m.t]?V[S.b[m.t][1]]*10-V[S.b[m.f][1]]:0)+(m.p?800:0);return L.sort((a,b)=>sc(b)-sc(a))}
function ab(S,d,a,b,ply){
  if(!d){if(chk(S.b,S.t)&&!legal(S).length)return-99999+ply;return ev(S)}
  const L=order(legal(S),S);if(!L.length)return chk(S.b,S.t)?-99999+ply:0;
  for(const m of L){const v=-ab(mk(S,m),d-1,-b,-a,ply+1);if(v>=b)return b;if(v>a)a=v}return a}
function pick(S,lv){if(lv==0&&opt.kind=='normal'&&opt.vs=='ai')return rig(S);const L=legal(S);
  if(lv==0){let best=L[0],bs=-1e9;for(const m of L){const n=mk(S,m);if(chk(n.b,n.t)&&!legal(n).length)continue;const v=ev(n)+Math.random()*40;if(v>bs){bs=v;best=m}}return best}
  if(lv==1&&Math.random()<.5)return L[Math.random()*L.length|0];
  const d=lv==1?1:lv==2?2:(Q=='lo'?2:3);let best=L[0],bs=-1e9;
  for(const m of order(L,S)){const v=-ab(mk(S,m),d-1,-1e6,lv==3?-bs:1e6,1)+(lv==3?0:Math.random()*6);if(v>bs){bs=v;best=m}}
  return best}

/* ===== TRẠNG THÁI & GIAO DIỆN ===== */
const opt={kind:'normal',vs:'ai',lv:2,col:'w',tm:180000};
let tn='',S,hist=[],fut=[],sel=null,last=null,over=true,busy=false,clk={w:0,b:0},run='w',lt=0,human='w',blitz=false,lm=[];
const flip=()=>opt.vs=='ai'&&human=='b';
const u=(c,k,x,y,s)=>`<svg class="${c}" viewBox="0 0 100 100" x="${x}" y="${y}" width="${s}" height="${s}"><use href="#${k}"/></svg>`;
document.querySelectorAll('.seg b,.tl b').forEach(b=>b.onclick=()=>{const g=b.parentNode;g.querySelectorAll('b').forEach(x=>x.classList.toggle('on',x==b));const v=b.dataset.v;opt[g.dataset.k]=/^\d+$/.test(v)?+v:v});
document.querySelectorAll('.sheet').forEach(s=>s.onclick=e=>{if(e.target==s)s.classList.remove('on')});
const ro=(x,y)=>`<g transform="translate(${x},${y})"><path d="M26 0v8" stroke="#8ff3e0" stroke-width="4"/><circle cx="26" cy="-3" r="4" fill="#f2c14e"/><rect y="8" width="52" height="42" rx="13" fill="#8ff3e0"/><circle cx="17" cy="26" r="6" fill="#0e1424"/><circle cx="35" cy="26" r="6" fill="#0e1424"/><rect x="17" y="38" width="18" height="4" rx="2" fill="#0e1424"/></g>`;
const cl=(x,y)=>`<g transform="translate(${x},${y})"><circle cx="26" cy="26" r="25" fill="#fff" stroke="#f2c14e" stroke-width="5"/><path d="M26 10v16l11 7" fill="none" stroke="#0e1424" stroke-width="4" stroke-linecap="round"/></g>`;
const CARDS=[['c1','normal','2p','Cờ thường','2 người chơi',u('w','K',6,14,84)+u('b','K',70,14,84)],
['c2','normal','ai','Cờ thường','Chơi với máy',u('w','N',6,14,84)+ro(98,34)],
['c3','blitz','2p','Cờ chớp','2 người, có đồng hồ',cl(10,30)+u('w','P',66,22,44)+u('b','P',108,22,44)],
['c4','blitz','ai','Cờ chớp','Với máy, có đồng hồ',cl(6,30)+u('w','Q',56,16,50)+ro(104,34)]];
$('#cards').innerHTML=CARDS.map((c,i)=>`<button class="cd ${c[0]}" data-i="${i}"><svg viewBox="0 0 160 110">${c[5]}</svg><b>${c[3]}</b><small>${c[4]}</small></button>`).join('');
$('#cards').onclick=e=>{const b=e.target.closest('.cd');if(!b)return;const c=CARDS[+b.dataset.i];opt.kind=c[1];opt.vs=c[2];
  if(c[1]=='normal'&&c[2]=='2p')return start();
  $('#shT').textContent=c[3]+' · '+c[4];$('#gLv').hidden=$('#gCol').hidden=c[2]!='ai';$('#gTm').hidden=c[1]!='blitz';$('#sh').classList.add('on')};
try{const o=JSON.parse(localStorage.getItem('opt')||'{}');for(const k of['lv','col','tm'])if(o[k]!=null)opt[k]=o[k]}catch(e){}
document.querySelectorAll('.tl').forEach(g=>g.querySelectorAll('b').forEach(b=>b.classList.toggle('on',String(opt[g.dataset.k])==b.dataset.v)));
const show=id=>document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));
function start(){startMusic();$('#sh').classList.remove('on');localStorage.setItem('opt',JSON.stringify(opt));show('game');newGame()}
$('#go').onclick=start;
function newGame(){S=init();hist=[];fut=[];sel=null;last=null;over=false;busy=false;blitz=opt.kind=='blitz';human=opt.col;
  clk={w:opt.tm,b:opt.tm};run='w';lt=performance.now();$('#ov').classList.remove('on');$('#cf').innerHTML='';
  render();if(opt.vs=='ai'&&human=='b')aiMove()}
$('#bN').onclick=$('#ovN').onclick=newGame;
$('#bM').onclick=$('#ovM').onclick=()=>{over=true;busy=false;$('#ov').classList.remove('on');$('#cf').innerHTML='';show('menu')};

/* ===== LÙI / TIẾN ===== */
const canB=()=>opt.vs=='ai'?hist.length>=2&&hist[hist.length-2].S.t==human:hist.length>0;
const canF=()=>opt.vs=='ai'?fut.length>=2:fut.length>0;
function navUp(){$('#bB').disabled=busy||!canB();$('#bF').disabled=busy||!canF()}
function nav(){sel=null;over=!legal(S).length;$('#ov').classList.remove('on');$('#cf').innerHTML='';
  if(blitz){run=S.t;lt=performance.now()}render();if(!over&&opt.vs=='ai'&&S.t!=human)aiMove()}
function back(){if(busy||!canB())return;do{fut.push({S,last});const h=hist.pop();S=h.S;last=h.last}while(opt.vs=='ai'&&S.t!=human);nav()}
function fwd(){if(busy||!canF())return;do{hist.push({S,last});const f=fut.pop();S=f.S;last=f.last}while(opt.vs=='ai'&&S.t!=human&&fut.length);nav()}
$('#bB').onclick=back;$('#bF').onclick=fwd;$('#ovB').onclick=()=>$('#ov').classList.remove('on');

/* ===== BOT SIÊU DỄ (cờ thường): người chơi luôn thắng, nhưng không sớm ===== */
const rigged=()=>opt.vs=='ai'&&opt.kind=='normal'&&opt.lv==0;
const ends=P=>legal(P).some(m=>{const Q=mk(P,m),c=chk(Q.b,Q.t);return(c||Q.b.filter(x=>x&&x[0]==Q.t).length<=3)&&!legal(Q).length});
const promo=P=>legal(P).some(m=>m.p);
function rig(S){const L=legal(S),h=S.t=='w'?'b':'w',n=S.n,t0=performance.now(),fw=h=='w'?-8:8,
  mat=c=>S.b.reduce((s,p)=>s+(p&&p[0]==c?V[p[1]]:0),0),lead=mat(S.t)-mat(h);
  let ok=L.filter(m=>legal(mk(S,m)).length>0);if(!ok.length)ok=L;
  const pw=[];S.b.forEach((p,i)=>{if(p==h+'P')pw.push([i,h=='w'?6-(i>>3):(i>>3)-1])});
  const sc=m=>{const N=mk(S,m);let s=Math.random()*20;
    for(const[i,a]of pw){if(m.t==i+fw)s+=300+a*60;else if(m.t!=i&&att(N.b,i,S.t))s+=50+a*20}
    const cv=S.b[m.t]?V[S.b[m.t][1]]:m.ep?100:0;
    if(cv){if(lead+cv>340)s-=500;else{const a=S.b[m.t]&&S.b[m.t][1]=='P'?(pw.find(x=>x[0]==m.t)||[0,0])[1]:0;s+=(S.b[m.t]&&S.b[m.t][1]=='P'&&n<30?150+a*40:120)}}
    return s};
  const R=ok.map(m=>[sc(m),m]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]),n40=n+2<40,n30=n+2<30;
  const s1=m=>{const N=mk(S,m);return!(n40&&ends(N))&&!(n30&&promo(N))};
  const s2=m=>{if(n+4>=40)return true;const N=mk(S,m);
    return legal(N).every(r=>{const Q=mk(N,r),B=legal(Q);return!B.length||B.some(b=>!ends(mk(Q,b)))})};
  if(!n40&&!n30)return R[0];
  const A=R.filter(s1);
  for(const m of A){if(performance.now()-t0>1200)break;if(s2(m))return m}
  return A[0]||R[0]}

/* ===== ĐỒ HỌA ===== */
function setQ(q){Q=q;localStorage.setItem('q',q);document.body.className='q-'+q;
  document.querySelectorAll('.q').forEach(b=>b.classList.toggle('on',b.dataset.q==q));if(!over&&S)render()}
document.querySelectorAll('.q').forEach(b=>b.onclick=()=>setQ(b.dataset.q));
$('#gear').onclick=()=>$('#se').classList.add('on');

const pending=()=>blitz&&!over&&run!=S.t;
function render(anim){lm=legal(S);const inC=chk(S.b,S.t),F=flip(),bd=$('#bd'),tg=sel!=null?lm.filter(m=>m.f==sel):[];let h='';
  for(let d=0;d<64;d++){const i=F?63-d:d,p=S.b[i];let c='sq '+(((i>>3)+(i&7))%2?'d':'l');
    if(last&&(i==last.f||i==last.t))c+=' lm';if(i==sel)c+=' sel';if(inC&&p==S.t+'K')c+=' chk';
    const t=tg.find(m=>m.t==i);if(t)c+=(p||t.ep)?' mv cap':' mv';
    h+=`<div class="${c}" data-i="${i}">${p?`<svg class="pc ${p[0]}" viewBox="0 0 100 100"><use href="#${p[1]}"/></svg>`:''}</div>`}
  bd.innerHTML=h;
  const rks=F?[1,2,3,4,5,6,7,8]:[8,7,6,5,4,3,2,1];
  const fls=F?['h','g','f','e','d','c','b','a']:['a','b','c','d','e','f','g','h'];
  $('#rk-col').innerHTML=rks.map(r=>`<span>${r}</span>`).join('');
  $('#fl-row').innerHTML=fls.map(f=>`<span>${f}</span>`).join('');
  if(anim&&last&&Q!='lo'&&matchMedia('(prefers-reduced-motion:no-preference)').matches){
    const dp=i=>F?63-i:i,a=dp(last.f),z=dp(last.t),e=bd.children[z].querySelector('.pc');
    if(e)e.animate([{transform:`translate(${((a&7)-(z&7))*116}%,${((a>>3)-(z>>3))*116}%)`},{transform:'none'}],{duration:Q=='hi'?220:150,easing:'cubic-bezier(.2,.8,.2,1)'})}
  const bc=F?'b':'w',tc=bc=='w'?'b':'w';
  for(const[id,c]of[['#pT',tc],['#pB',bc]]){const e=$(id);e.dataset.c=c;
    e.querySelector('.nm').textContent=opt.vs=='ai'?(c==human?'Bạn':'Máy · '+LV[opt.lv]):NM[c];
    e.classList.toggle('rot',opt.vs=='2p'&&id=='#pT');
    e.classList.toggle('act',!over&&(blitz?run==c:S.t==c));
    e.classList.toggle('pend',pending()&&run==c&&(opt.vs=='2p'||c==human));
    e.onclick=()=>press(c)}
  clocks();navUp();
  $('#st').textContent=over?'':tn?tn:busy?'Máy đang nghĩ…':pending()&&(opt.vs=='2p'||run==human)?'Bấm đồng hồ của bạn để đổi lượt':inC?'Chiếu! Lượt '+NM[S.t]:'Lượt '+NM[S.t]}
$('#bd').onclick=e=>{const q=e.target.closest('.sq');if(q)tap(+q.dataset.i)};
function clocks(){for(const id of['#pT','#pB']){const e=$(id),c=e.dataset.c,k=e.querySelector('.ck');let t='';
  if(blitz){const ms=Math.max(0,clk[c]),s=Math.ceil(ms/1000);t=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');k.classList.toggle('low',ms<10000)}
  if(k.textContent!=t)k.textContent=t}}

/* ===== LƯỢT ĐI ===== */
function tap(i){if(over||busy||(opt.vs=='ai'&&S.t!=human)||(blitz&&run!=S.t))return;
  const m=sel!=null&&lm.find(x=>x.f==sel&&x.t==i);if(m)return doMove(m);
  sel=S.b[i]&&S.b[i][0]==S.t&&i!=sel?i:null;render()}
function toast(t){tn=t;$('#st').textContent=t;setTimeout(()=>{if(tn==t){tn='';if(!over)render()}},2400)}
function end(w,why){over=true;render();
  if(!w)return finish('draw','Hai bên ngang tài ngang sức');
  if(opt.vs=='ai')return w==human?finish('win',why+'Bạn đã thắng máy cấp độ '+LV[opt.lv]):finish('lose',why+'Thử lại nhé, bạn sẽ làm được!');
  finish('win',why+NM[w]+' thắng')}
function doMove(m){hist.push({S,last});fut=[];if(hist.length>(opt.vs=='ai'?20:10))hist.shift();const mover=S.t;S=mk(S,m);last=m;sel=null;
  if(!legal(S).length)return end(chk(S.b,S.t)?mover:null,'Chiếu hết! ');
  if(chk(S.b,S.t)&&(opt.vs=='2p'||S.t==human))warn();
  if(blitz&&opt.vs=='ai'&&run!=human){run=S.t;lt=performance.now()}
  render(true);if(opt.vs=='ai'&&S.t!=human&&(!blitz||run==S.t))aiMove()}
function press(c){if(!pending()||run!=c||(opt.vs=='ai'&&c!=human))return;tick();run=S.t;lt=performance.now();render();if(opt.vs=='ai'&&S.t!=human)aiMove()}
function aiMove(){busy=true;render();const snap=S;setTimeout(()=>{if(over||S!==snap)return;const m=pick(S,opt.lv);busy=false;doMove(m)},350)}
function tick(){const n=performance.now();if(!over&&blitz&&S){clk[run]-=n-lt;if(clk[run]<=0){clk[run]=0;end(run=='w'?'b':'w','Hết giờ! ')}}lt=n}
setInterval(()=>{if(!over&&blitz&&S&&!document.hidden&&$('#game').classList.contains('on')){tick();clocks()}},250);

/* ===== POPUP KẾT QUẢ ===== */
const JW=[0,4,7,12,16,19,24],JL=[-3,-5,-8,-12],JD=[7,4,7,4,0];
function finish(kind,sub){const m={win:['🏆','Chiến thắng!'],lose:['😢','Thua rồi!'],draw:['🤝','Hòa vui vẻ!']}[kind];
  $('#pp').className=kind;$('#ovE').textContent=m[0];$('#ovT').textContent=m[1];$('#ovS').textContent=sub;
  $('#cf').innerHTML=kind=='win'&&Q!='lo'?Array.from({length:24},()=>`<span style="left:${Math.random()*100}%;background:hsl(${Math.random()*360} 90% 60%);animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s"></span>`).join(''):'';
  $('#ov').classList.add('on');
  kind=='win'?jingle(JW,130,.9,.12):kind=='lose'?jingle(JL,380,1.4,.1):jingle(JD,160,.6,.1)}

/* ===== NHẠC (WebAudio, không cần mạng) ===== */
let ac,tmr,st=0,mus=localStorage.getItem('mus')!=='0',trk=+(localStorage.getItem('trk')||0),snd=localStorage.getItem('snd')!=='0';
const CH=[[0,4,7,11],[-3,0,4,7],[-7,-3,0,4],[-5,-1,2,7]],PT=[0,1,2,3,2,1,3,2];
function note(n,len,g,w){const o=ac.createOscillator(),a=ac.createGain(),t=ac.currentTime;
  o.type=w||'sine';o.frequency.value=261.63*2**(n/12);a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+.04);a.gain.exponentialRampToValueAtTime(.0005,t+len);
  o.connect(a).connect(ac.destination);o.start(t);o.stop(t+len)}
const TR=[{ms:480,bar:3,ch:CH,pt:PT,len:1.8,g:.05,bl:3.2,oc:12,w:'sine'},
{ms:620,bar:3,ch:[[0,4,7,11],[-3,0,4,7],[-8,-5,0,4],[-5,-1,2,5]],pt:[0,-1,2,-1,1,-1,3,-1],len:2.6,g:.045,bl:3.8,oc:0,w:'sine'},
{ms:240,bar:3,ch:[[0,4,7,12],[-5,-1,2,7],[-3,0,4,9],[-7,-3,0,5]],pt:[0,2,1,3,0,2,3,1],len:.35,g:.05,bl:.5,oc:12,w:'triangle'},
{ms:900,bar:3,ch:[[2,6,9,13],[-1,2,6,9],[-5,-1,2,6],[-3,1,4,9]],pt:[0,-1,-1,2,-1,-1,1,-1],len:4.5,g:.04,bl:6,oc:0,w:'sine'}];
function startMusic(){if(!mus)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();if(tmr)return;const T=TR[trk];
  tmr=setInterval(()=>{if(document.hidden)return;const ch=T.ch[(st>>T.bar)%T.ch.length],i=T.pt[st%T.pt.length];if(st%(1<<T.bar)==0)note(ch[0]-12,T.bl,T.g*1.4,T.w);if(i>=0)note(ch[i]+(st%16>7?T.oc:0),T.len,T.g,T.w);st++},T.ms)}
function warn(){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();note(9,.22,.12,'triangle');setTimeout(()=>note(9,.3,.12,'triangle'),180)}catch(e){}
  try{const sy=speechSynthesis,vs=sy.getVoices();if(vs.length&&!vs.some(v=>/^vi/i.test(v.lang)))return;const u=new SpeechSynthesisUtterance('Chiếu tướng!');u.lang='vi-VN';u.rate=.95;const v=vs.find(v=>/^vi/i.test(v.lang));if(v)u.voice=v;sy.cancel();setTimeout(()=>sy.speak(u),380)}catch(e){}}
function jingle(ns,dt,len,g){if(!mus)return;startMusic();ns.forEach((n,i)=>setTimeout(()=>note(n,len,g),i*dt))}
function setMu(){$('#mu').classList.toggle('off',!mus);$('#mu').textContent=mus?'🎵':'🔇'}
function setMus(v){mus=v;localStorage.setItem('mus',v?'1':'0');setMu();if(v)startMusic();else{clearInterval(tmr);tmr=0;ac&&ac.suspend()}}
function setTrk(i){trk=i;localStorage.setItem('trk',i);st=0;clearInterval(tmr);tmr=0;document.querySelectorAll('.qt').forEach(b=>b.classList.toggle('on',+b.dataset.t==i));startMusic()}
$('#mu').onclick=()=>$('#sd').classList.add('on');
document.querySelectorAll('.qt').forEach(b=>{b.classList.toggle('on',+b.dataset.t==trk);b.onclick=()=>{setTrk(+b.dataset.t);if(!mus)setMus(true);setMus(true)}});
document.querySelectorAll('[data-k=mu] b').forEach(b=>{b.classList.toggle('on',(b.dataset.v=='1')==mus);b.addEventListener('click',()=>setMus(b.dataset.v=='1'))});
document.querySelectorAll('[data-k=sn] b').forEach(b=>{b.classList.toggle('on',(b.dataset.v=='1')==snd);b.addEventListener('click',()=>{snd=b.dataset.v=='1';localStorage.setItem('snd',snd?'1':'0')})});
$('#tw').onclick=()=>{const k=snd;snd=true;warn();snd=k};
document.addEventListener('visibilitychange',()=>{if(!ac)return;document.hidden?ac.suspend():mus&&ac.resume()});
function sil(){const b=new Uint8Array(46),d=new DataView(b.buffer),w=(o,t)=>[...t].forEach((c,i)=>b[o+i]=c.charCodeAt(0));w(0,'RIFF');d.setUint32(4,38,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,16000,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,2,true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
let sau;
function unlock(){if(!mus&&!snd)return;try{navigator.audioSession&&(navigator.audioSession.type='playback')}catch(e){}
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state!='running')ac.resume();
    if(!sau){sau=new Audio(sil());sau.loop=true;sau.setAttribute('playsinline','')}if(sau.paused)sau.play().catch(()=>{});
    if(!unlock.s&&window.speechSynthesis){unlock.s=1;const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}}
['pointerdown','touchend','click'].forEach(e=>addEventListener(e,unlock,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!sau)return;document.hidden?sau.pause():(mus||snd)&&sau.play().catch(()=>{})});
setMu();setQ(Q);

/* ===== TỰ ĐỘNG KIỂM TRA & CẬP NHẬT ===== */
const VER='3.2.0';let reg,nv=null,aut=localStorage.getItem('au')!=='0',upd=0;
const sl=ms=>new Promise(r=>setTimeout(r,ms)),us=t=>$('#us').textContent=t;
async function cup(man){us('Đang kiểm tra…');
  try{if(reg)await reg.update().catch(()=>{});const t=await(await fetch('sw.js?'+Date.now(),{cache:'no-store'})).text(),m=t.match(/VER='([^']+)'/);
    if(m&&m[1]!==VER){nv=m[1];us('Có phiên bản mới v'+nv+' (bạn đang dùng v'+VER+')');$('#uc').textContent='Cập nhật ngay';$('#gear').classList.add('nu');
      if(!man){$('#ubt').textContent='Có bản mới v'+nv;$('#ub').hidden=false}}
    else{us('Bạn đang dùng bản mới nhất ✓');$('#uc').textContent='Kiểm tra cập nhật'}}
  catch(e){us(man?'Không kiểm tra được, hãy kiểm tra kết nối mạng':'')}}
async function apply(){us('Đang cập nhật…');upd=1;$('#ub').hidden=true;
  try{if(reg){await reg.update().catch(()=>{});for(let i=0;i<12&&!reg.waiting;i++)await sl(250);if(reg.waiting){reg.waiting.postMessage('skip');await sl(2500)}}}catch(e){}
  try{for(const k of await caches.keys())await caches.delete(k)}catch(e){}
  location.reload()}
$('#uc').onclick=()=>nv?apply():cup(1);$('#ubb').onclick=apply;$('#vr').textContent='v'+VER;
document.querySelectorAll('[data-k=au] b').forEach(b=>{b.classList.toggle('on',(b.dataset.v=='1')==aut);b.addEventListener('click',()=>{aut=b.dataset.v=='1';localStorage.setItem('au',aut?'1':'0');if(aut)cup(0)})});
if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('controllerchange',()=>{if(upd)location.reload()});
setTimeout(()=>aut&&cup(0),4000);setInterval(()=>aut&&!document.hidden&&cup(0),30*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&aut)cup(0)});
