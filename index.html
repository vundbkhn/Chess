<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CỜ VUA PRO v3.3.3</title>
  <style>
    :root {
      --bg-app: #1e2022;
      --bg-panel: #272a2d;
      --bg-card: #313539;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #779556;
      --accent-hover: #86a663;
      --border-subtle: rgba(255, 255, 255, 0.08);

      /* Theme mặc định: Xanh Giải Đấu (Chess.com Neo) */
      --sq-light: #ebecd0;
      --sq-dark: #779556;
      --sq-last-light: #f5f682;
      --sq-last-dark: #b9ca43;
      --sq-select: rgba(245, 246, 130, 0.85);
      --board-frame: #2b2e26;
      --coord-light: #779556;
      --coord-dark: #ebecd0;
      --move-dot: rgba(0, 0, 0, 0.16);
      --capture-ring: rgba(0, 0, 0, 0.18);
    }

    /* Theme 1: Xanh Giải Đấu (Chess.com Neo) */
    body[data-board="neo-green"] {
      --sq-light: #ebecd0;
      --sq-dark: #779556;
      --sq-last-light: #f5f682;
      --sq-last-dark: #b9ca43;
      --sq-select: rgba(245, 246, 130, 0.85);
      --board-frame: #363d2e;
      --coord-light: #779556;
      --coord-dark: #ebecd0;
    }

    /* Theme 2: Gỗ Cổ Điển (Mịn, không vân kẻ gây nhức mắt) */
    body[data-board="classic-wood"] {
      --sq-light: #f0d9b5;
      --sq-dark: #b58863;
      --sq-last-light: #cdd26a;
      --sq-last-dark: #aaa23a;
      --sq-select: rgba(205, 210, 106, 0.85);
      --board-frame: #5c3d28;
      --coord-light: #b58863;
      --coord-dark: #f0d9b5;
    }

    /* Theme 3: Cổ Điển Phẳng (Xanh Xám Dịu) */
    body[data-board="flat-slate"] {
      --sq-light: #dee3e6;
      --sq-dark: #8ca2ad;
      --sq-last-light: #c3d887;
      --sq-last-dark: #9cb868;
      --sq-select: rgba(195, 216, 135, 0.85);
      --board-frame: #3a474e;
      --coord-light: #8ca2ad;
      --coord-dark: #dee3e6;
    }

    /* Theme 4: Gỗ Sáng Hiện Đại (Kem Ngà - Caramel & Chấm Bạc Hà) */
    body[data-board="modern-wood"] {
      --sq-light: #f9f9f5;
      --sq-dark: #d3a17c;
      --sq-last-light: #c8eed7;
      --sq-last-dark: #bae2bd;
      --sq-select: #c8eed7;
      --board-frame: #5a4232;
      --coord-light: #a97956;
      --coord-dark: #f9f9f5;
      --move-dot: #b3ebca;
      --capture-ring: #f15954;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 1040px;
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .app-container {
        grid-template-columns: 1fr;
        max-width: 560px;
        gap: 12px;
      }
    }

    /* Khu vực bàn cờ */
    .board-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-panel);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-avatar {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
    }

    .player-name {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .turn-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      display: none;
    }

    .player-bar.active .turn-badge {
      display: inline-block;
    }

    .captured-list {
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 22px;
      flex-wrap: wrap;
    }

    .captured-list svg {
      width: 18px;
      height: 18px;
    }

    /* Khung bàn cờ chuẩn xác, không lẹm viền trên cả chế độ Máy yếu */
    .board-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--board-frame);
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    body.low-spec .board-wrapper {
      box-shadow: none;
      border: 2px solid var(--board-frame);
    }

    .chess-board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 7px;
      overflow: hidden;
      position: relative;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .square.light {
      background-color: var(--sq-light);
      color: var(--coord-light);
    }

    .square.dark {
      background-color: var(--sq-dark);
      color: var(--coord-dark);
    }

    .square.last-move.light {
      background-color: var(--sq-last-light);
    }

    .square.last-move.dark {
      background-color: var(--sq-last-dark);
    }

    .square.selected {
      background-color: var(--sq-select) !important;
    }

    .square.in-check {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.9) 0%, rgba(220, 38, 38, 0.55) 65%, transparent 100%) !important;
    }

    .coord-rank {
      position: absolute;
      top: 3px;
      left: 4px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .coord-file {
      position: absolute;
      bottom: 3px;
      right: 4px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .piece-wrap {
      width: 86%;
      height: 86%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: transform 0.12s ease;
    }

    body:not(.low-spec) .piece-wrap {
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.22));
    }

    body.low-spec .piece-wrap {
      transition: none;
      filter: none;
    }

    .square.selected .piece-wrap {
      transform: translateY(-2px) scale(1.04);
    }

    .piece-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Gợi ý nước đi hợp lệ */
    .move-dot {
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: var(--move-dot);
      pointer-events: none;
    }

    .capture-ring {
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      border: 4px solid var(--capture-ring);
      pointer-events: none;
    }

    /* Bảng điều khiển & Tab UI */
    .side-panel {
      background: var(--bg-panel);
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.16);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin: 0;
    }

    .version-pill {
      font-size: 11px;
      font-weight: 700;
      background: rgba(119, 149, 86, 0.25);
      color: #b7d694;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(119, 149, 86, 0.45);
    }

    .tabs-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #202326;
      border-bottom: 1px solid var(--border-subtle);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-content {
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .tab-content.active {
      display: flex;
    }

    .control-group {
      background: var(--bg-card);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .group-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Thẻ chọn Theme trực quan */
    .theme-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .theme-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 11px;
      border-radius: 8px;
      background: #25282c;
      border: 2px solid transparent;
      cursor: pointer;
      color: var(--text-main);
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .theme-card.active {
      border-color: var(--accent);
      background: rgba(119, 149, 86, 0.16);
    }

    .theme-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .theme-name {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-new {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: #779556;
      color: #fff;
      font-weight: 700;
    }

    .theme-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    .theme-swatch {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: #25282c;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: #383c42;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn.selected-opt {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .status-box {
      padding: 10px 12px;
      border-radius: 8px;
      background: #202326;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      border: 1px solid var(--border-subtle);
    }

    .move-history {
      max-height: 170px;
      overflow-y: auto;
      background: #202326;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: grid;
      grid-template-columns: 34px 1fr 1fr;
      gap: 4px 8px;
      border: 1px solid var(--border-subtle);
    }

    .move-num {
      color: var(--text-muted);
    }

    /* Modal phong cấp */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .promo-card {
      background: var(--bg-panel);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      text-align: center;
      width: 290px;
    }

    .promo-choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .promo-btn {
      aspect-ratio: 1 / 1;
      background: var(--sq-light);
      border: 2px solid var(--sq-dark);
      border-radius: 8px;
      padding: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body data-board="neo-green" data-piece-style="neo">
  <div class="app-container">
    <!-- BÀN CỜ -->
    <div class="board-section">
      <div class="player-bar" id="bar-top">
        <div class="player-info">
          <div class="player-avatar">Đ</div>
          <div>
            <div class="player-name">
              <span id="name-top">Máy AI (Đen)</span>
              <span class="turn-badge">Đang đi</span>
            </div>
            <div class="captured-list" id="captured-by-black"></div>
          </div>
        </div>
      </div>

      <div class="board-wrapper">
        <div class="chess-board" id="chess-board"></div>
      </div>

      <div class="player-bar active" id="bar-bottom">
        <div class="player-info">
          <div class="player-avatar">T</div>
          <div>
            <div class="player-name">
              <span id="name-bottom">Bạn (Trắng)</span>
              <span class="turn-badge">Đang đi</span>
            </div>
            <div class="captured-list" id="captured-by-white"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- BẢNG ĐIỀU KHIỂN TAB UI -->
    <div class="side-panel">
      <div class="panel-header">
        <h1 class="panel-title">CỜ VUA CHIẾN THUẬT</h1>
        <span class="version-pill">v3.3.3</span>
      </div>

      <div class="tabs-nav">
        <button class="tab-btn active" data-tab="tab-play">Trận đấu</button>
        <button class="tab-btn" data-tab="tab-theme">Giao diện</button>
        <button class="tab-btn" data-tab="tab-settings">Cài đặt</button>
      </div>

      <!-- TAB 1: TRẬN ĐẤU -->
      <div class="tab-content active" id="tab-play">
        <div class="status-box" id="game-status">Lượt của quân Trắng</div>

        <div class="btn-row">
          <button class="btn btn-primary" id="btn-new-game">Ván mới</button>
          <button class="btn" id="btn-undo">Đi lại</button>
        </div>

        <div class="control-group">
          <div class="group-label">Chế độ chơi</div>
          <div class="btn-row">
            <button class="btn selected-opt" data-mode="ai">Đấu với Máy</button>
            <button class="btn" data-mode="pvp">2 Người chơi</button>
          </div>
        </div>

        <div class="control-group" id="ai-level-group">
          <div class="group-label">Cấp độ Máy AI</div>
          <div class="btn-row" style="grid-template-columns: repeat(3, 1fr);">
            <button class="btn" data-depth="1">Dễ</button>
            <button class="btn selected-opt" data-depth="2">Vừa</button>
            <button class="btn" data-depth="3">Khó</button>
          </div>
        </div>

        <div class="control-group">
          <div class="group-label">Lịch sử nước đi</div>
          <div class="move-history" id="move-history"></div>
        </div>
      </div>

      <!-- TAB 2: GIAO DIỆN & THEME -->
      <div class="tab-content" id="tab-theme">
        <div class="control-group">
          <div class="group-label">Bộ Theme Trọn Gói</div>
          <div class="theme-grid">
            <button class="theme-card active" data-preset="neo-green">
              <div class="theme-meta">
                <div class="theme-name">Xanh Giải Đấu (Neo) <span class="badge-new">MỚI</span></div>
                <div class="theme-desc">Bàn cờ xanh chuẩn giải đấu + Quân cờ 2D Neo sắc nét</div>
              </div>
              <div class="theme-swatch">
                <span style="background:#ebecd0"></span>
                <span style="background:#779556"></span>
                <span style="background:#779556"></span>
                <span style="background:#ebecd0"></span>
              </div>
            </button>

            <button class="theme-card" data-preset="classic-wood">
              <div class="theme-meta">
                <div class="theme-name">Gỗ Cổ Điển</div>
                <div class="theme-desc">Tông gỗ ấm dịu mắt, bề mặt mịn chống lóa</div>
              </div>
              <div class="theme-swatch">
                <span style="background:#f0d9b5"></span>
                <span style="background:#b58863"></span>
                <span style="background:#b58863"></span>
                <span style="background:#f0d9b5"></span>
              </div>
            </button>

            <button class="theme-card" data-preset="flat-slate">
              <div class="theme-meta">
                <div class="theme-name">Cổ Điển Phẳng</div>
                <div class="theme-desc">Xanh xám hiện đại, tương phản nhẹ nhàng</div>
              </div>
              <div class="theme-swatch">
                <span style="background:#dee3e6"></span>
                <span style="background:#8ca2ad"></span>
                <span style="background:#8ca2ad"></span>
                <span style="background:#dee3e6"></span>
              </div>
            </button>

            <button class="theme-card" data-preset="modern-wood">
              <div class="theme-meta">
                <div class="theme-name">Gỗ Sáng Hiện Đại <span class="badge-new">MỚI</span></div>
                <div class="theme-desc">Kem ngà - caramel ấm, chấm bạc hà &amp; quân khối nổi</div>
              </div>
              <div class="theme-swatch">
                <span style="background:#f9f9f5"></span>
                <span style="background:#d3a17c"></span>
                <span style="background:#d3a17c"></span>
                <span style="background:#f9f9f5"></span>
              </div>
            </button>
          </div>
        </div>

        <div class="control-group">
          <div class="group-label">Tùy chỉnh kiểu quân cờ riêng</div>
          <div class="btn-row" style="grid-template-columns: repeat(3, 1fr);">
            <button class="btn selected-opt" data-piece="neo">Neo 2D</button>
            <button class="btn" data-piece="classic">Cổ Điển</button>
            <button class="btn" data-piece="staunton3d">Khối Nổi</button>
          </div>
        </div>
      </div>

      <!-- TAB 3: CÀI ĐẶT HỆ THỐNG -->
      <div class="tab-content" id="tab-settings">
        <div class="control-group">
          <div class="group-label">Tối ưu đồ họa</div>
          <div class="btn-row">
            <button class="btn selected-opt" data-perf="standard">Tiêu chuẩn</button>
            <button class="btn" data-perf="low">Máy yếu</button>
          </div>
        </div>

        <div class="control-group">
          <div class="group-label">Tùy chọn hiển thị</div>
          <div class="btn-row">
            <button class="btn selected-opt" id="btn-toggle-coords">Tọa độ: Bật</button>
            <button class="btn selected-opt" id="btn-toggle-sound">Âm thanh: Bật</button>
          </div>
        </div>

        <div class="control-group">
          <div class="group-label">Góc nhìn bàn cờ</div>
          <button class="btn" id="btn-flip-board">Xoay chiều bàn cờ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL PHONG CẤP -->
  <div class="modal-backdrop" id="promo-modal">
    <div class="promo-card">
      <div style="font-weight:700; font-size:15px;">CHỌN QUÂN PHONG CẤP</div>
      <div class="promo-choices" id="promo-choices"></div>
    </div>
  </div>

  <script>
    /* =========================================================
       BỘ QUÂN CỜ VECTOR SVG: PHONG CÁCH NEO (CHESS.COM NEO) & CỔ ĐIỂN
       ========================================================= */
    const PIECE_SVGS = {
      neo: {
        wP: `<svg viewBox="0 0 45 45">

    const audioCtx = typeof AudioContext !== 'undefined' ? new AudioContext() : null;
    function playTone(type) {

    function cloneBoard(b) {

    function inBounds(r, c) {
      return r >= 0 && r < 8 && c >= 0 && c < 8;

    function getPseudoMoves(board, r, c, castling, enPassant) {
      const piece = board[r][c];
      if (!piece) return [];
      const color = piece[0];
      const type = piece[1];
      const opp = color === 'w' ? 'b' : 'w';

        const promoRow = color === 'w' ? 0 : 7;

        if (inBounds(r + dir, c) && !board[r + dir][c]) {
          add(r + dir, c, { promo: r + dir === promoRow });
          if (r === startRow && !board[r + 2 * dir][c]) {
            add(r + 2 * dir, c, { doublePawn: true });
          }

        for (const dc of [-1, 1]) {

          if (!inBounds(nr, nc)) continue;
          if (board[nr][nc] && board[nr][nc][0] === opp) {
            add(nr, nc, { promo: nr === promoRow });
          } else if (enPassant && enPassant.r === nr && enPassant.c === nc) {

          }

        for (const [dr, dc] of jumps) {
          const nr = r + dr, nc = c + dc;
          if (inBounds(nr, nc) && (!board[nr][nc] || board[nr][nc][0] === opp)) add(nr, nc);
        }
      } else if (type === 'B' || type === 'R' || type === 'Q') {
        const dirs = [];
        if (type === 'B' || type === 'Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
        if (type === 'R' || type === 'Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
        for (const [dr, dc] of dirs) {
          let nr = r + dr, nc = c + dc;
          while (inBounds(nr, nc)) {
            if (!board[nr][nc]) {

            } else {
              if (board[nr][nc][0] === opp) add(nr, nc);
              break;
            }
            nr += dr; nc += dc;
          }

      } else if (type === 'K') {

            if (!dr && !dc) continue;
            const nr = r + dr, nc = c + dc;
            if (inBounds(nr, nc) && (!board[nr][nc] || board[nr][nc][0] === opp)) add(nr, nc);

          }
          if (castling[color + 'Q'] && !board[row][3] && !board[row][2] && !board[row][1] && board[row][0] === color + 'R') {

          if (!p || p[0] !== byColor) continue;

            if (r + dir === tr && (c - 1 === tc || c + 1 === tc)) return true;
          } else {
            const pm = getPseudoMoves(board, r, c, null, null);
            if (pm.some(m => m.tr === tr && m.tc === tc)) return true;

      const color = piece[0];
      const opp = color === 'w' ? 'b' : 'w';
      let captured = nb[move.tr][move.tc];

        nb[move.fr][3] = color + 'R';
        nb[move.fr][0] = null;
      }

      if (piece === 'wK') { nc.wK = false; nc.wQ = false; }
      if (piece === 'bK') { nc.bK = false; nc.bQ = false; }
      if (move.fr === 7 && move.fc === 0) nc.wQ = false;
      if (move.fr === 7 && move.fc === 7) nc.wK = false;
      if (move.fr === 0 && move.fc === 0) nc.bQ = false;
      if (move.fr === 0 && move.fc === 7) nc.bK = false;
      if (move.tr === 7 && move.tc === 0) nc.wQ = false;
      if (move.tr === 7 && move.tc === 7) nc.wK = false;
      if (move.tr === 0 && move.tc === 0) nc.bQ = false;

      if (move.castle === 'K') return 'O-O';

      const files = 'abcdefgh';
      const p = board[move.fr][move.fc][1];
      const isCap = board[move.tr][move.tc] || move.enPassant;

    function evaluateBoard(board) {

      for (let r = 0; r < 8; r++) {

          if (!p) continue;
          const isW = p[0] === 'w';
          const type = p[1];
          const pstRow = isW ? r : 7 - r;
          const val = PIECE_VALUES[type] + PST[type][pstRow][c];
          score += isW ? val : -val;
        }
      }
      return score;
    }

    function minimax(board, depth, alpha, beta, maximizing, castling, enPassant) {
      const color = maximizing ? 'w' : 'b';
      const moves = getAllLegalMoves(board, color, castling, enPassant);
      if (depth === 0 || moves.length === 0) {
        if (moves.length === 0) {
          if (isInCheck(board, color)) return maximizing ? -99999 - depth : 99999 + depth;
          return 0;
        }
        return evaluateBoard(board);
      }

      // Ưu tiên xét nước ăn quân trước để cắt tỉa Alpha-Beta nhanh hơn
      moves.sort((a, b) => (board[b.tr][b.tc] ? 1 : 0) - (board[a.tr][a.tc] ? 1 : 0));

      if (maximizing) {
        let maxEval = -Infinity;
        for (const m of moves) {
          const res = applyMoveRaw(board, castling, m, 'Q');
          const ev = minimax(res.board, depth - 1, alpha, beta, false, res.castling, res.enPassant);
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          const res = applyMoveRaw(board, castling, m, 'Q');
          const ev = minimax(res.board, depth - 1, alpha, beta, true, res.castling, res.enPassant);
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function triggerAIMove() {
      if (state.gameOver || state.turn !== 'b' || state.mode !== 'ai') return;
      setTimeout(() => {
        const moves = getAllLegalMoves(state.board, 'b', state.castling, state.enPassant);
        if (moves.length === 0) return;
        let bestMove = moves[0];

        for (const m of moves) {

          const val = minimax(res.board, state.aiDepth - 1, -Infinity, Infinity, true, res.castling, res.enPassant);
          if (val < bestVal) {

    function executeMove(move, promoPiece = 'Q') {

        board: cloneBoard(state.board),

      });

      const notation = toAlgebraic(state.board, move, promoPiece);
      const res = applyMoveRaw(state.board, state.castling, move, promoPiece);
      state.board = res.board;
      state.castling = res.castling;
      state.enPassant = res.enPassant;
      state.lastMove = { fr: move.fr, fc: move.fc, tr: move.tr, tc: move.tc };
      state.selected = null;

      state.turn = state.turn === 'w' ? 'b' : 'w';

      const inChk = isInCheck(state.board, state.turn);

      }

        if (foundMove.promo) {
          state.pendingPromo = foundMove;
          openPromoModal(state.turn);
        } else {
          executeMove(foundMove);
        }
        return;
      }

      const piece = state.board[r][c];
      if (piece && piece[0] === state.turn) {
        state.selected = { r, c };
        state.legalMoves = getLegalMovesForSquare(state.board, r, c, state.castling, state.enPassant);
      } else {
        state.selected = null;
        state.legalMoves = [];
      }
      renderBoard();
    }

    function openPromoModal(color) {
      const modal = document.getElementById('promo-modal');
      const box = document.getElementById('promo-choices');
      box.innerHTML = '';
      ['Q','R','B','N'].forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'promo-btn';
        btn.innerHTML = PIECE_SVGS[state.pieceStyle][color + t];
        btn.onclick = () => {
          modal.classList.remove('open');
          const m = state.pendingPromo;
          state.pendingPromo = null;
          executeMove(m, t);
        };
        box.appendChild(btn);
      });
      modal.classList.add('open');
    }

    function renderBoard() {
      const boardEl = document.getElementById('chess-board');
      boardEl.innerHTML = '';
      const files = ['a','b','c','d','e','f','g','h'];
      const checkKing = isInCheck(state.board, state.turn) ? findKing(state.board, state.turn) : null;

      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
          const r = state.flipped ? 7 - i : i;
          const c = state.flipped ? 7 - j : j;
          const sq = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          sq.className = 'square ' + (isLight ? 'light' : 'dark');

          if (state.lastMove && ((state.lastMove.fr === r && state.lastMove.fc === c) || (state.lastMove.tr === r && state.lastMove.tc === c))) {
            sq.classList.add('last-move');
          }
          if (state.selected && state.selected.r === r && state.selected.c === c) {
            sq.classList.add('selected');
          }
          if (checkKing && checkKing.r === r && checkKing.c === c) {
            sq.classList.add('in-check');
          }

          if (state.showCoords) {
            if (j === 0) {
              const rankSpan = document.createElement('span');
              rankSpan.className = 'coord-rank';
              rankSpan.textContent = 8 - r;
              sq.appendChild(rankSpan);
            }
            if (i === 7) {
              const fileSpan = document.createElement('span');
              fileSpan.className = 'coord-file';
              fileSpan.textContent = files[c];
              sq.appendChild(fileSpan);
            }
          }

          const piece = state.board[r][c];
          if (piece) {
            const pWrap = document.createElement('div');
            pWrap.className = 'piece-wrap';
            pWrap.innerHTML = PIECE_SVGS[state.pieceStyle][piece];
            sq.appendChild(pWrap);
          }

          const legal = state.legalMoves.find(m => m.tr === r && m.tc === c);
          if (legal) {
            if (piece || legal.enPassant) {
              const ring = document.createElement('div');
              ring.className = 'capture-ring';
              sq.appendChild(ring);
            } else {
              const dot = document.createElement('div');
              dot.className = 'move-dot';
              sq.appendChild(dot);
            }
          }

          sq.onclick = () => handleSquareClick(r, c);
          boardEl.appendChild(sq);
        }
      }
    }

    function renderAll() {
      renderBoard();
      const statusEl = document.getElementById('game-status');
      const oppMoves = getAllLegalMoves(state.board, state.turn, state.castling, state.enPassant);
      const inChk = isInCheck(state.board, state.turn);

      if (oppMoves.length === 0) {
        if (inChk) {
          statusEl.textContent = state.turn === 'w' ? 'CHIẾU HẾT! Quân Đen thắng' : 'CHIẾU HẾT! Quân Trắng thắng';
        } else {
          statusEl.textContent = 'HÒA CỜ (Hết nước đi hợp lệ)';
        }
      } else {
        const sideText = state.turn === 'w' ? 'quân Trắng' : 'quân Đen';
        statusEl.textContent = inChk ? `CHIẾU TƯỚNG! Lượt của ${sideText}` : `Lượt của ${sideText}`;
      }

      document.getElementById('bar-top').classList.toggle('active', state.turn === 'b');
      document.getElementById('bar-bottom').classList.toggle('active', state.turn === 'w');

      const capW = document.getElementById('captured-by-white');
      const capB = document.getElementById('captured-by-black');
      capW.innerHTML = ''; capB.innerHTML = '';
      state.moveList.forEach(m => {
        if (!m.captured) return;
        const span = document.createElement('span');
        span.innerHTML = PIECE_SVGS[state.pieceStyle][m.captured];
        if (m.color === 'w') capW.appendChild(span);
        else capB.appendChild(span);
      });

      const histEl = document.getElementById('move-history');
      histEl.innerHTML = '';
      for (let i = 0; i < state.moveList.length; i += 2) {
        const num = document.createElement('div');
        num.className = 'move-num';
        num.textContent = (i / 2 + 1) + '.';
        const wMove = document.createElement('div');
        wMove.textContent = state.moveList[i] ? state.moveList[i].text : '';
        const bMove = document.createElement('div');
        bMove.textContent = state.moveList[i + 1] ? state.moveList[i + 1].text : '';
        histEl.appendChild(num); histEl.appendChild(wMove); histEl.appendChild(bMove);
      }
      histEl.scrollTop = histEl.scrollHeight;
    }

    function resetGame() {
      state.board = cloneBoard(INIT_BOARD);
      state.turn = 'w';
      state.castling = { wK: true, wQ: true, bK: true, bQ: true };
      state.enPassant = null;
      state.history = [];
      state.moveList = [];
      state.selected = null;
      state.legalMoves = [];
      state.lastMove = null;
      state.gameOver = false;
      renderAll();
    }

    function savePrefs() {
      try {
        localStorage.setItem('chess_v333_prefs', JSON.stringify({
          board: document.body.dataset.board,
          pieceStyle: state.pieceStyle,
          lowSpec: document.body.classList.contains('low-spec'),
          showCoords: state.showCoords,
          sound: state.sound
        }));
      } catch (e) {}
    }

    function loadPrefs() {
      try {
        const raw = localStorage.getItem('chess_v333_prefs') || localStorage.getItem('chess_v332_prefs');
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p.board) document.body.dataset.board = p.board;
        if (p.pieceStyle) state.pieceStyle = p.pieceStyle;
        if (p.lowSpec) document.body.classList.add('low-spec');
        if (typeof p.showCoords === 'boolean') state.showCoords = p.showCoords;
        if (typeof p.sound === 'boolean') state.sound = p.sound;
      } catch (e) {}
    }

    // Sự kiện Tab UI
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      };
    });

    // Chọn bộ Theme
    document.querySelectorAll('.theme-card').forEach(card => {
      card.onclick = () => {
        document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        const preset = card.dataset.preset;
        document.body.dataset.board = preset;
        if (preset === 'neo-green') {
          state.pieceStyle = 'neo';
          document.querySelectorAll('[data-piece]').forEach(b => b.classList.toggle('selected-opt', b.dataset.piece === 'neo'));
        } else if (preset === 'modern-wood') {
          state.pieceStyle = 'staunton3d';
          document.querySelectorAll('[data-piece]').forEach(b => b.classList.toggle('selected-opt', b.dataset.piece === 'staunton3d'));
        }
        savePrefs();
        renderAll();
      };
    });

    // Chọn kiểu quân cờ riêng
    document.querySelectorAll('[data-piece]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('[data-piece]').forEach(b => b.classList.remove('selected-opt'));
        btn.classList.add('selected-opt');
        state.pieceStyle = btn.dataset.piece;
        savePrefs();
        renderAll();
      };
    });

    // Chế độ chơi & Độ khó
    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('selected-opt'));
        btn.classList.add('selected-opt');
        state.mode = btn.dataset.mode;
        document.getElementById('ai-level-group').style.display = state.mode === 'ai' ? 'flex' : 'none';
        document.getElementById('name-top').textContent = state.mode === 'ai' ? 'Máy AI (Đen)' : 'Người chơi 2 (Đen)';
        resetGame();
      };
    });

    document.querySelectorAll('[data-depth]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('[data-depth]').forEach(b => b.classList.remove('selected-opt'));
        btn.classList.add('selected-opt');
        state.aiDepth = Number(btn.dataset.depth);
      };
    });

    // Cài đặt hiệu năng & Hiển thị
    document.querySelectorAll('[data-perf]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('[data-perf]').forEach(b => b.classList.remove('selected-opt'));
        btn.classList.add('selected-opt');
        document.body.classList.toggle('low-spec', btn.dataset.perf === 'low');
        savePrefs();
      };
    });

    document.getElementById('btn-toggle-coords').onclick = function() {
      state.showCoords = !state.showCoords;
      this.textContent = 'Tọa độ: ' + (state.showCoords ? 'Bật' : 'Tắt');
      this.classList.toggle('selected-opt', state.showCoords);
      savePrefs();
      renderBoard();
    };

    document.getElementById('btn-toggle-sound').onclick = function() {
      state.sound = !state.sound;
      this.textContent = 'Âm thanh: ' + (state.sound ? 'Bật' : 'Tắt');
      this.classList.toggle('selected-opt', state.sound);
      savePrefs();
    };

    document.getElementById('btn-flip-board').onclick = () => {
      state.flipped = !state.flipped;
      renderBoard();
    };

    document.getElementById('btn-new-game').onclick = resetGame;

    document.getElementById('btn-undo').onclick = () => {
      if (state.history.length === 0) return;
      let prev = state.history.pop();
      if (state.mode === 'ai' && state.turn === 'w' && state.history.length > 0) {
        prev = state.history.pop();
      }
      state.board = prev.board;
      state.turn = prev.turn;
      state.castling = prev.castling;
      state.enPassant = prev.enPassant;
      state.lastMove = prev.lastMove;
      state.moveList = prev.moveList;
      state.selected = null;
      state.legalMoves = [];
      state.gameOver = false;
      renderAll();
    };

    loadPrefs();
    document.querySelectorAll('.theme-card').forEach(c => c.classList.toggle('active', c.dataset.preset === document.body.dataset.board));
    document.querySelectorAll('[data-piece]').forEach(b => b.classList.toggle('selected-opt', b.dataset.piece === state.pieceStyle));
    document.querySelectorAll('[data-perf]').forEach(b => b.classList.toggle('selected-opt', b.dataset.perf === (document.body.classList.contains('low-spec') ? 'low' : 'standard')));
    document.getElementById('btn-toggle-coords').textContent = 'Tọa độ: ' + (state.showCoords ? 'Bật' : 'Tắt');
    document.getElementById('btn-toggle-coords').classList.toggle('selected-opt', state.showCoords);
    document.getElementById('btn-toggle-sound').textContent = 'Âm thanh: ' + (state.sound ? 'Bật' : 'Tắt');
    document.getElementById('btn-toggle-sound').classList.toggle('selected-opt', state.sound);

    resetGame();
  </script>
</body>
</html>
